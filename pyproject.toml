[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent"
version = "0.2.0"
description = "A minimal Windows-first modular coding agent"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "agent-client-protocol>=0.11,<1",
  "httpx>=0.27,<1",
  "httpx-sse>=0.4,<1",
  "jsonschema>=4.20,<5",
  "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
]

[project.scripts]
mini-agent = "mini_agent.app.main:run"
mini-agent-acp = "mini_agent.protocols.acp.server:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --basetemp=tmp/pytest"
cache_dir = "tmp/pytest-cache"
